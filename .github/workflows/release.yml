# A version tag (vX.Y.Z) checks Pixel Picker (ci.yml), builds and starts it (build.yml) and
# publishes the build as a GitHub release. The tag must match the version in Cargo.toml (which
# the window title and the executable's properties show).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: the tag is the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare the tag with Cargo.toml
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$cargo_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but Cargo.toml says $cargo_version"
            exit 1
          fi

  check:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: PixelPicker-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pixel Picker ${GITHUB_REF_NAME#v}" \
            --generate-notes
